<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Speed Limit Sign Checker{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8;
      --card: #ffffff;
      --border: #e2e2e6;
      --text: #1a1a1e;
      --muted: #6b6b74;
      --accent: #2f6fed;
      --ok: #1d8a4a;
      --warn: #b25a00;
      --err: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181c;
        --card: #1f2025;
        --border: #33343a;
        --text: #eceef1;
        --muted: #9a9aa4;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px 16px 64px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 12px 0 4px; }
    label:first-child { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      padding: 0;
      accent-color: var(--accent);
    }
    .criterion-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .criterion-row label { flex: 1; min-width: 0; margin: 0; font-size: 0.85rem; color: var(--text); }
    .criterion-row input[type="number"] { flex: 0 0 80px; width: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      margin-top: 18px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    td, th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
    td.key { color: var(--muted); white-space: nowrap; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .badge.ok { background: rgba(29,138,74,0.15); color: var(--ok); }
    .badge.warn { background: rgba(178,90,0,0.15); color: var(--warn); }
    .badge.err { background: rgba(198,40,40,0.15); color: var(--err); }
    img.sign { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); }
    .thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .thumbs img { width: 140px; height: 140px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    pre.log { white-space: pre-wrap; font-size: 0.8rem; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 12px; max-height: 320px; overflow-y: auto; }
    a { color: var(--accent); }
    .speed { font-size: 2rem; font-weight: 700; }

    .thumb-btn {
      margin-top: 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: none;
      cursor: pointer;
      display: block;
      width: 140px;
      height: 140px;
      overflow: hidden;
    }
    .thumb-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Shared by every full-screen modal (#lightbox, #gmap-modal, ...).
       Deliberately a class, not an ID: an ID selector here would beat the
       browser's built-in `[hidden] { display: none }` rule on specificity
       and silently override it - exactly the bug that made the lightbox
       show up on every page load regardless of the hidden attribute. The
       matching `.modal-overlay[hidden]` rule below restores it correctly. */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 40px 20px;
    }
    .modal-overlay[hidden] { display: none; }
    .lightbox-inner { max-width: 1000px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .lightbox-topbar { display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 0.85rem; gap: 12px; }
    .lightbox-close, .lightbox-arrow {
      margin-top: 0;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      border-radius: 50%;
      cursor: pointer;
    }
    .lightbox-close { width: 32px; height: 32px; font-size: 1.1rem; flex: 0 0 auto; }
    .lightbox-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      min-height: 200px;
    }
    .lightbox-stage img { max-width: 100%; max-height: 55vh; display: block; object-fit: contain; }
    #lb-error {
      display: none;
      color: #ff8a8a;
      background: rgba(255, 0, 0, 0.08);
      border: 1px solid rgba(255, 100, 100, 0.4);
      border-radius: 8px;
      padding: 16px;
      margin: 20px;
      max-width: 80%;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.45);
      width: 40px;
      height: 40px;
      font-size: 1.3rem;
    }
    .lightbox-arrow.prev { left: 12px; }
    .lightbox-arrow.next { right: 12px; }
    .lightbox-arrow:disabled { opacity: 0.3; cursor: default; }
    .lightbox-bottom { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
    .lightbox-caption { color: #eee; font-size: 0.85rem; flex: 1; min-width: 200px; }
    .lightbox-caption .heading-label { color: #fff; font-weight: 600; }
    .lightbox-map-wrap {
      width: 220px;
      height: 160px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.25);
      flex: 0 0 auto;
    }
    #lb-map { width: 100%; height: 100%; background: #333; }
    .lb-arrow-icon { display: flex; align-items: center; justify-content: center; }

    .btn-secondary {
      margin-top: 0;
      background: none;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    #gmap-modal .lightbox-inner { max-width: 1100px; }
    #gmap { width: 100%; height: 65vh; min-height: 320px; border-radius: 12px; background: #222; }
    #gmap-error {
      display: none;
      color: #ff8a8a;
      background: rgba(255, 0, 0, 0.08);
      border: 1px solid rgba(255, 100, 100, 0.4);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 12px;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="wrap">
    <h1>Speed Limit Sign Checker</h1>
    <p class="subtitle">calc_out.speed_limits_&lt;STATE&gt;_&lt;YEAR&gt;_&lt;MONTH&gt;_details vs. Street View</p>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
