<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Speed Limit Sign Checker{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8;
      --card: #ffffff;
      --border: #e2e2e6;
      --text: #1a1a1e;
      --muted: #6b6b74;
      --accent: #2f6fed;
      --ok: #1d8a4a;
      --warn: #b25a00;
      --err: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181c;
        --card: #1f2025;
        --border: #33343a;
        --text: #eceef1;
        --muted: #9a9aa4;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px 16px 64px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 12px 0 4px; }
    label:first-child { margin-top: 0; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      margin-top: 18px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { color: var(--muted); font-size: 0.85rem; margin-top: 10px; display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    td, th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
    td.key { color: var(--muted); white-space: nowrap; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .badge.ok { background: rgba(29,138,74,0.15); color: var(--ok); }
    .badge.warn { background: rgba(178,90,0,0.15); color: var(--warn); }
    .badge.err { background: rgba(198,40,40,0.15); color: var(--err); }
    img.sign { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); }
    .thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .thumbs img { width: 140px; height: 140px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    pre.log { white-space: pre-wrap; font-size: 0.8rem; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 12px; }
    a { color: var(--accent); }
    .speed { font-size: 2rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Speed Limit Sign Checker</h1>
    <p class="subtitle">calc_out.speed_limits_&lt;STATE&gt;_&lt;YEAR&gt;_&lt;MONTH&gt;_details vs. Street View</p>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
